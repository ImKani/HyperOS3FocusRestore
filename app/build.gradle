plugins { id 'com.android.application' }

android {
    namespace 'com.hyperos3.focusrestore'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hyperos3.focusrestore'
        minSdk 27
        targetSdk 35
        versionCode 15
        versionName '0.3.9'
    }

    buildTypes {
        release {
            // Sign local release test builds so ADB can install them.
            signingConfig signingConfigs.debug
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "HyperOS3FocusRestore-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}

